eeg_driver:
  ros__parameters:
    sampling_rate: 250.0
    channel_count: 8
    frame_samples: 10
    signal_amplitude: 1.0
    noise_std: 0.35
    log_file: logs/runtime/ssvep_simulation.log.txt

linux_eeg_driver:
  ros__parameters:
    device_name: ""
    device_name_prefix: "VIS_BCI_"
    device_address: ""
    configuration_hex: ""
    scan_timeout: 10.0
    connect_timeout: 15.0
    reconnect_delay: 3.0
    notification_timeout: 3.0
    data_file: logs/eeg_latest.txt
    log_file: logs/runtime/linux_eeg_driver.log.txt

ssvep_stimulus:
  ros__parameters:
    auto_cycle: true
    cycle_seconds: 6.0
    frequency: 10.0
    mode: forward
    log_file: logs/runtime/ssvep_simulation.log.txt

ssvep_decoder:
  ros__parameters:
    window_seconds: 3.0
    analysis_period: 0.5
    min_confidence: 0.40
    log_file: logs/runtime/ssvep_simulation.log.txt
